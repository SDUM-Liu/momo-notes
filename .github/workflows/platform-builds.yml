name: Platform builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            runner: windows-2025
            command: npm run dist
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - name: Ubuntu-x64
            runner: ubuntu-24.04
            command: npm run dist:linux
            files: |
              release/*.AppImage
              release/latest-linux.yml
          - name: macOS-arm64
            runner: macos-15
            command: npm run dist:mac:preview -- --arm64
            files: |
              release/*.dmg
              release/*.zip
          - name: macOS-x64
            runner: macos-15-intel
            command: npm run dist:mac:preview -- --x64
            files: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android · debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run mobile:sync -- android
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - run: bash gradlew --no-daemon assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS · simulator
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync -- ios
      - run: |
          version=$(node -p 'require("./package.json").version')
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath ios/build MARKETING_VERSION="$version" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent ios/build/Build/Products/Debug-iphonesimulator/App.app ios/Momo-Notes-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-simulator
          path: ios/Momo-Notes-iOS-Simulator.zip
          if-no-files-found: error
