name: Android in-app upgrade verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android · APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm pkg set version=0.5.999
      - run: npm run mobile:sync -- android
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - run: bash gradlew --no-daemon assembleRelease
        working-directory: android
      - name: Sign and verify the Android release
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          : "${ANDROID_RELEASE_KEYSTORE:?Missing Android release keystore}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?Missing Android release keystore password}"
          umask 077
          temporary="$(mktemp -d)"
          trap 'rm -f "$temporary/release.p12" "$temporary/aligned.apk"; rmdir "$temporary"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | tr -d '\r\n' | base64 --decode > "$temporary/release.p12"
          ANDROID_RELEASE_KEY_PASSWORD="$(printf '%s' "$ANDROID_RELEASE_KEY_PASSWORD" | tr -d '\r\n')"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          output="android/app/build/outputs/apk/release"
          "$build_tools/zipalign" -P 16 -f 4 "$output/app-release-unsigned.apk" "$temporary/aligned.apk"
          "$build_tools/apksigner" sign --ks "$temporary/release.p12" --ks-type PKCS12 \
            --ks-key-alias momo-notes --ks-pass env:ANDROID_RELEASE_KEY_PASSWORD \
            --v4-signing-enabled false --out "$output/app-release.apk" "$temporary/aligned.apk"
          verification="$("$build_tools/apksigner" verify --print-certs "$output/app-release.apk")"
          fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$verification")"
          [[ "$fingerprint" == "$(cat android/release-certificate.sha256)" ]]
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 android/update_smoke.py android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-diagnostics
          path: smoke-output/
