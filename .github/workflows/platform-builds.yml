name: iOS universal simulator build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ios:
    name: iOS · simulator
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 088c4952dfcf4101dce8f35f93d27b4067b5c0f6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync -- ios
      - run: |
          version=$(node -p 'require("./package.json").version')
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath ios/build MARKETING_VERSION="$version" CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO "ARCHS=arm64 x86_64" build
          lipo -verify_arch arm64 x86_64 ios/build/Build/Products/Debug-iphonesimulator/App.app/App
          ditto -c -k --keepParent ios/build/Build/Products/Debug-iphonesimulator/App.app ios/Momo-Notes-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-simulator
          path: ios/Momo-Notes-iOS-Simulator.zip
          if-no-files-found: error

