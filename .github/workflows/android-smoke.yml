name: Android runtime smoke test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Android version, without v
        default: '0.8.0'
        type: string
      build_run:
        description: Use the signed Android artifact from this build run instead
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: inputs.build_run == ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir tested-apk
          curl --fail --location --retry 3 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Momo-Notes-$VERSION-Android.apk" \
            --output tested-apk/app-release.apk
      - uses: actions/download-artifact@v4
        if: inputs.build_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: Android
          path: tested-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 android/smoke.py tested-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-smoke-diagnostics
          path: smoke-output/
