appId: io.github.sdumliu.momo-notes
productName: Momo Notes
directories:
  output: release
files:
  - desktop/**
  - shared/**
  - dist/**
  - build/icon.png
  - LICENSE
  - THIRD-PARTY-NOTICES.txt
publish:
  provider: github
  owner: SDUM-Liu
  repo: momo-notes
  releaseType: release
win:
  icon: build/icon.png
  artifactName: Momo-Notes-${version}-Setup-${arch}.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target: [zip, dmg]
  artifactName: Momo-Notes-${version}-mac-${arch}.${ext}
linux:
  icon: build/icon.png
  category: Office
  target: [AppImage]
  artifactName: Momo-Notes-${version}-linux-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: 桃桃便签
  deleteAppDataOnUninstall: false
