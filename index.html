<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>桃桃便签</title>
</head>
<body>
  <button id="mascot" class="mascot" title="单击打开便签，拖动可移动" aria-label="打开便签">
    <img id="mascot-image" alt="" draggable="false">
    <span class="mobile-caption">打开便签</span>
  </button>
  <main id="panel" class="panel" hidden>
    <header class="top">
      <div id="title-drag" class="title-drag"><span class="brand-dot"></span>桃桃便签</div>
      <nav aria-label="便签工具">
        <button id="history" data-icon="calendar" title="历史便签" aria-label="历史便签"></button>
        <button id="browser" data-icon="globe" title="内置浏览器" aria-label="内置浏览器"></button>
        <button id="question" data-icon="sparkles" title="问便签 AI" aria-label="问便签 AI"></button>
        <button id="settings" data-icon="settings" title="设置" aria-label="设置"></button>
      </nav>
    </header>
    <section id="note-view" class="view">
      <div class="category-bar" aria-label="便签分类">
        <label class="category-picker">分类<select id="categories" aria-label="便签分类"></select></label>
        <button id="new-category" type="button" class="quiet" aria-label="新建分类" title="新建分类">＋</button>
      </div>
      <form id="category-form" class="category-bar" hidden>
        <input id="category-name" placeholder="输入分类名称" aria-label="分类名称" maxlength="24" required>
        <button type="submit" class="primary">创建</button><button id="category-cancel" type="button" class="quiet">取消</button>
      </form>
      <div class="date-line">
        <div><div id="date-caption" class="date-caption"></div><h1 id="note-date"></h1></div>
        <button id="return-today" class="quiet" hidden>回到今天</button>
      </div>
      <div class="toolbar" role="toolbar" aria-label="编辑格式">
        <button data-edit="bold" data-icon="bold" title="粗体 Ctrl+B" aria-label="粗体"></button>
        <button data-edit="italic" data-icon="italic" title="斜体 Ctrl+I" aria-label="斜体"></button>
        <button data-edit="underline" data-icon="underline" title="下划线 Ctrl+U" aria-label="下划线"></button>
        <button data-edit="strike" data-icon="strikethrough" title="删除线" aria-label="删除线"></button>
        <i></i>
        <button data-edit="heading" data-icon="heading" title="二级标题" aria-label="二级标题"></button>
        <button data-edit="taskList" data-icon="list-checks" title="编号待办" aria-label="编号待办"></button>
        <button data-edit="bulletList" data-icon="list" title="项目符号" aria-label="项目符号"></button>
        <button data-edit="orderedList" data-icon="list-ordered" title="普通编号" aria-label="普通编号"></button>
        <i></i>
        <button id="insert-link" data-icon="link" title="插入链接" aria-label="插入链接"></button>
        <button id="insert-image" data-icon="image" title="插入图片" aria-label="插入图片"></button>
        <button id="table-tools" data-icon="table-2" title="插入与编辑表格" aria-label="插入与编辑表格"></button>
        <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
      </div>
      <div id="table-menu" class="table-menu" hidden>
        <button data-table="insertTable">插入 3×3 表格</button><button data-table="addRowAfter">添加行</button>
        <button data-table="addColumnAfter">添加列</button><button data-table="deleteRow">删除行</button>
        <button data-table="deleteColumn">删除列</button><button data-table="deleteTable">删除表格</button>
      </div>
      <form id="link-form" class="link-form" hidden>
        <label>链接地址<input id="link-url" type="url" inputmode="url" placeholder="https://…" required></label>
        <label id="link-label-row">显示文字<input id="link-label" placeholder="默认使用链接地址"></label>
        <div class="link-actions"><button id="link-cancel" type="button" class="quiet">取消</button><button type="submit" class="primary">确认</button></div>
        <span id="link-error" role="status" class="error"></span>
      </form>
      <div id="editor" class="editor-scroll"></div>
      <footer class="foot"><span id="status" role="status"></span><span id="progress"></span></footer>
    </section>
    <section id="browser-view" class="view" hidden>
      <form id="browser-bar">
        <button id="browser-back" type="button" class="quiet" aria-label="网页后退" title="网页后退">‹</button>
        <input id="browser-url" type="url" inputmode="url" aria-label="网址" placeholder="https://…" required>
        <button class="quiet" type="submit">打开</button>
      </form>
      <span id="browser-status" role="status"></span>
      <div id="browser-viewport">
        <p id="browser-empty">输入网址，或点击便签中的链接。</p>
      </div>
    </section>
    <section id="history-view" class="view sub-view" hidden>
      <div class="subhead"><h1>历史便签</h1><button class="quiet back">返回</button></div>
      <div id="dates" class="dates"></div>
    </section>
    <section id="settings-view" class="view sub-view" hidden>
      <div class="subhead"><h1>设置</h1><button class="quiet back">返回</button></div>
      <form id="settings-form">
        <div class="project-links">
          <button id="settings-sync" type="button" class="quiet">设备同步</button>
          <button id="project-repo" type="button" class="quiet">开源仓库</button>
          <button id="project-issues" type="button" class="quiet">问题反馈</button>
        </div>
        <div class="settings-group desktop-only">
          <label class="switch-row">窗口置顶<input id="pin" type="checkbox" role="switch"></label>
          <label class="switch-row">开机启动<input id="startup" type="checkbox" role="switch"></label>
          <label class="switch-row">拖至屏幕边缘时收起<input id="snap" type="checkbox" role="switch"></label>
          <div class="image-setting">
            <img id="edge-preview" alt="侧边栏形象预览">
            <span>侧边栏形象</span><button id="choose-edge" type="button" class="quiet">更换</button>
            <button id="reset-edge" type="button" class="quiet">还原</button>
          </div>
        </div>
        <h2>应用更新</h2>
        <div class="settings-group update-box">
          <div>
            <strong id="app-version"></strong>
            <div id="update-status" role="status"></div>
          </div>
          <button id="update-action" type="button" class="quiet">检查更新</button>
          <progress id="update-progress" max="100" aria-label="更新下载进度" hidden></progress>
        </div>
        <label id="automatic-update-row" class="switch-row update-setting desktop-only">
          后台下载，退出时自动安装<input id="automatic-update" type="checkbox" role="switch">
        </label>
        <h2>AI 连接</h2>
        <p id="mobile-ai-host" hidden>配对后，AI API 由主机调用。</p>
        <fieldset id="api-settings" class="settings-group fields">
          <label>API 地址<input id="base-url" placeholder="https://服务地址/v1" maxlength="500"></label>
          <label>模型<input id="model" placeholder="服务方提供的模型 ID" maxlength="150"></label>
          <label>API 密钥<input id="api-key" type="password" autocomplete="off" maxlength="1000"></label>
          <button id="clear-key" class="quiet" type="button">清除已存密钥</button>
          <label>本地 HTTP 代理端口<input id="proxy" inputmode="numeric" placeholder="留空直连" maxlength="5"></label>
        </fieldset>
      </form>
      <div class="subfoot"><span id="settings-status" role="status"></span><button type="submit" form="settings-form" class="primary">保存设置</button></div>
    </section>
    <section id="sync-view" class="view sub-view" hidden>
      <div class="subhead"><h1>设备同步</h1><button id="sync-back" class="quiet">返回设置</button></div>
      <div class="sync-body">
        <p id="sync-status" role="status"></p>
        <div id="sync-host">
          <button id="sync-enable" class="primary">开启主机同步</button>
          <div id="sync-host-details" hidden>
            <label>主机地址<select id="sync-address"></select></label>
            <img id="sync-qr" alt="同步配对二维码" hidden>
            <label>配对码<input id="sync-code" readonly></label>
            <button id="sync-rotate" class="quiet">更换配对码</button>
            <p>移动设备须能访问本机的 TCP 38425 端口。更换配对码后需重新配对。</p>
          </div>
        </div>
        <form id="sync-mobile" hidden>
          <label>主机配对码<input id="sync-pair-code" placeholder="粘贴配对码或识别二维码" autocomplete="off" maxlength="100" required></label>
          <label class="quiet qr-picker">识别二维码<input id="sync-photo" type="file" accept="image/*" capture="environment"></label>
          <button id="sync-pair" class="primary" type="submit">配对并同步</button>
          <button id="sync-now" class="quiet" type="button" hidden>立即同步</button>
          <button id="sync-unpair" class="quiet" type="button" hidden>取消配对</button>
        </form>
      </div>
    </section>
    <section id="ai-view" class="view sub-view" hidden>
      <div class="subhead"><h1>问便签 AI</h1><button class="quiet back">返回</button></div>
      <form id="ai-form">
        <label>读取范围<select id="scope"><option value="current">当前分类 · 本页</option><option value="history">当前分类 · 含历史</option></select></label>
        <p>可使用配置好的 API，或复制便签和问题后粘贴到 ChatGPT 聊天。</p>
        <label for="prompt">你的问题</label>
        <textarea id="prompt" maxlength="2000" placeholder="例如，还有哪些事情没做？" required></textarea>
        <button id="send-question" type="submit" class="primary">发送</button>
        <div class="project-links">
          <button id="copy-chat" type="button" class="quiet">复制到 ChatGPT</button>
          <button id="open-chat" type="button" class="quiet">打开 ChatGPT 网页</button>
        </div>
        <textarea id="chat-text" aria-label="可手动复制的聊天内容" readonly hidden></textarea>
        <div id="answer" class="answer" role="status" hidden></div>
      </form>
    </section>
  </main>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
